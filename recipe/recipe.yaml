context:
  version: "5.0.1"

package:
  name: salt-terminal
  version: ${{ version }}

source:
  url: https://forge.hekkelman.net/maarten/salt/archive/v${{ version }}.tar.gz
  sha256: f322e57b164fd5aa7443807b71327d4ac5ca9520118778baaee959aff84ca141

build:
  number: 0
  # Remove windows in the future when we have windows support
  skip:
    - osx
    - win
  script: |
    set -exo pipefail
    cmake -S . -B build -G Ninja \
      ${CMAKE_ARGS} \
      -DBUILD_DOCUMENTATION=ON
    cmake --build build --parallel ${CPU_COUNT}
    ./build/salt -i --prefix ${PREFIX}

    if [[ "${target_platform}" == linux-* ]]; then
      mkdir -p "${PREFIX}/Menu"

      # Prefer the icon/menu metadata produced by upstream's installer when
      # available; only fall back to the recipe-local asset if it is absent.
      if [[ ! -f "${PREFIX}/Menu/salt_menu.json" ]]; then
        cp "${RECIPE_DIR}/menu.json" "${PREFIX}/Menu/salt_menu.json"
      fi

      if [[ ! -f "${PREFIX}/Menu/salt.png" ]]; then
        upstream_icon=""
        for search_dir in "${PREFIX}/share" "${PREFIX}/lib" "${PREFIX}/libexec" "${PREFIX}/usr/share" "${PREFIX}/opt"; do
          if [[ -d "${search_dir}" ]]; then
            upstream_icon="$(find "${search_dir}" -type f \( -iname "salt*.png" -o -iname "salt*.svg" -o -iname "icon*.png" -o -iname "icon*.svg" \) 2>/dev/null | head -n 1)"
            if [[ -n "${upstream_icon}" ]]; then
              break
            fi
          fi
        done

        if [[ -n "${upstream_icon}" ]]; then
          cp "${upstream_icon}" "${PREFIX}/Menu/salt.png"
        fi
      fi
    fi

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
    - myst-parser
    - pkg-config
    - sphinx
  host:
    - asio
    - cryptopp
    - expat
    - freetype
    - glib
    - gtk4
    - libcanberra
    - libgxrio
    - liblzma-devel
    - libmcfp
    - libmgui
    - libpinch
    - libzeep
    - maartens_resource_compiler
    - zeem
    - zlib

tests:
  - script:
      - salt --version
      - salt --help
  - package_contents:
      bin:
        - salt
      files:
        - Menu/salt_menu.json
        - Menu/salt.png

about:
  homepage: https://forge.hekkelman.net/maarten/salt
  documentation: https://forge.hekkelman.net/maarten/salt/src/tag/v${{ version }}/salt-manual.md
  repository: https://forge.hekkelman.net/maarten/salt
  license: BSD-2-Clause
  license_file: LICENSE
  summary: "Terminal with built-in SSH"
  description: Salt is a terminal emulator with built-in SSH.

extra:
  recipe-maintainers:
    - eunos-1128
